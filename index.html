<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>デビエーション収容箱マップ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{--bg:#061014;--panel:rgba(6,16,20,.86);--line:rgba(75,255,235,.28);--accent:#23e6d5;--text:#e9fbff;--muted:#99b5bd;--danger:#ff5268;}
    *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
    button,input,textarea{font:inherit;color:inherit} button{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer} button:active{transform:scale(.98)}
    .app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 30%,#10252d 0,#061014 65%)}
    header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(3,9,12,.78);backdrop-filter:blur(10px);z-index:5}
    h1{font-size:18px;margin:0;line-height:1.2}.sub{font-size:11px;color:var(--muted)}.topBtns{display:flex;gap:8px}.topBtns button{padding:8px 10px;font-size:13px}
    .stage{position:relative;flex:1;overflow:hidden;touch-action:none;}
    .mapLayer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
    .mapImg{display:block;width:1100px;max-width:none;user-select:none;-webkit-user-drag:none;filter:saturate(1.05) contrast(1.03)}
    .pin{position:absolute;transform:translate(-50%,-100%);width:34px;height:42px;border:0;background:transparent;padding:0;z-index:2;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6));}
    .pin span{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#111b20,#26373d);border:2px solid #d8f4ff;color:white;font-size:18px;box-shadow:0 0 12px rgba(35,230,213,.65)}
    .pin.done span{border-color:var(--accent);background:linear-gradient(145deg,#08473f,#12a896)}.pin::after{content:"";position:absolute;left:12px;top:28px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:10px solid #d8f4ff}.pin.done::after{border-top-color:var(--accent)}
    .hud{position:absolute;left:12px;top:12px;width:220px;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;backdrop-filter:blur(10px)}
    .hud h2{margin:0 0 8px;font-size:14px}.stat{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}.stat b{display:block;color:var(--text);font-size:22px;margin-top:4px}.checks{margin-top:12px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px;font-size:13px;display:grid;gap:8px}label{display:flex;align-items:center;gap:8px}input[type=checkbox]{accent-color:var(--accent)}
    .zoom{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:grid;gap:8px;z-index:3}.zoom button{width:44px;height:44px;font-size:24px;padding:0;background:rgba(3,9,12,.72)}
    .bottom{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.legend,.coords{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--muted)}.legend{display:flex;gap:12px;flex-wrap:wrap}.legend b{color:var(--text)}
    .drawer{position:absolute;right:12px;top:78px;bottom:12px;width:min(380px,calc(100% - 24px));z-index:4;background:rgba(5,13,17,.94);border:1px solid var(--line);border-radius:14px;transform:translateX(calc(100% + 20px));transition:.22s;box-shadow:0 18px 50px rgba(0,0,0,.45);overflow:auto}.drawer.open{transform:translateX(0)}
    .drawer img{width:100%;display:block;border-radius:13px 13px 0 0}.drawerBody{padding:14px}.drawer h2{margin:0 0 4px;font-size:18px}.tag{display:inline-block;color:#051014;background:var(--accent);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}.row{border-top:1px solid rgba(255,255,255,.08);padding:10px 0}.row small{display:block;color:var(--muted);margin-bottom:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.danger{border-color:rgba(255,82,104,.45);color:#ffd8de}
    .addForm{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:min(420px,calc(100% - 24px));background:rgba(5,13,17,.96);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.55)}.addForm.open{display:block}.addForm input,.addForm textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:10px;margin:6px 0 10px}.addForm textarea{min-height:80px}.hint{font-size:12px;color:var(--muted);line-height:1.5}
    @media(max-width:720px){header{height:58px}.topBtns button{font-size:12px;padding:7px 8px}.hud{width:184px;font-size:12px}.drawer{top:auto;height:56%;}.legend{display:none}.mapImg{width:1000px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>デビエーション収容箱マップ</h1><div class="sub">MANIBUS BASE MAP / Ver0.1</div></div>
    <div class="topBtns"><button id="addBtn">＋ピン追加</button><button id="fitBtn">全体表示</button><button id="exportBtn">保存データ</button></div>
  </header>
  <main class="stage" id="stage">
    <div class="mapLayer" id="mapLayer">
      <img class="mapImg" id="mapImg" src="manibus-map.jpeg" alt="マニブス全域マップ">
      <div id="pins"></div>
    </div>
    <section class="hud">
      <h2>発見状況</h2>
      <div class="stat"><span>登録数<b id="total">0</b></span><span>回収済み<b id="done">0</b></span></div>
      <div class="checks">
        <label><input type="checkbox" id="showAll" checked>すべて表示</label>
        <label><input type="checkbox" id="showUndone">未回収のみ</label>
      </div>
      <div class="hint" style="margin-top:10px">ドラッグ：移動<br>ピンチ：拡大/縮小<br>追加：地図を長押し or ＋ピン追加</div>
    </section>
    <div class="zoom"><button id="zin">＋</button><button id="zout">−</button></div>
    <div class="bottom"><div class="legend"><b>📦 未回収</b><b>✅ 回収済み</b><span>ピンをタップで詳細</span></div><div class="coords" id="coords">X: 0 / Y: 0</div></div>
    <aside class="drawer" id="drawer"></aside>
    <form class="addForm" id="form">
      <h2>収容箱ピンを追加</h2>
      <div class="hint">地図上の位置を指定してから内容を入力します。座標は画像上の割合で保存されます。</div>
      <input id="name" placeholder="名前 例：デビエーション収容箱 No.001" required>
      <input id="place" placeholder="場所メモ 例：ダークハーツ地域 北側の建物付近">
      <input id="coord" placeholder="ゲーム座標 例：2340,-546">
      <textarea id="desc" placeholder="説明文"></textarea>
      <div class="actions"><button type="submit">登録</button><button type="button" id="cancelBtn">キャンセル</button></div>
    </form>
  </main>
</div>
<script>
const DEFAULT_PINS=[
 {id:'p1',x:.64,y:.31,name:'デビエーション収容箱 No.001',place:'ローンウルフ荒野 周辺',coord:'2340,-546',desc:'試作用ピン。実際の場所に合わせて後で編集してください。',done:false},
 {id:'p2',x:.48,y:.49,name:'デビエーション収容箱 No.002',place:'クルタ山 周辺',coord:'2440,-5567',desc:'試作用ピン。ピン位置・説明は自由に変更できます。',done:false},
 {id:'p3',x:.73,y:.64,name:'デビエーション収容箱 No.003',place:'ブロークンデルタ 周辺',coord:'未入力',desc:'回収済みチェックの動作確認用。',done:true}
];
let pins=JSON.parse(localStorage.getItem('deviboxPins')||'null')||DEFAULT_PINS;
const stage=document.getElementById('stage'), layer=document.getElementById('mapLayer'), img=document.getElementById('mapImg'), pinsEl=document.getElementById('pins');
let scale=1, tx=0, ty=0, active=null, selected=null, addPos={x:.5,y:.5};
function save(){localStorage.setItem('deviboxPins',JSON.stringify(pins));}
function apply(){layer.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
function fit(){const r=stage.getBoundingClientRect(); const iw=img.naturalWidth||1100, ih=img.naturalHeight||1000; const s=Math.min(r.width/iw,r.height/ih)*.96; scale=s; tx=(r.width-iw*s)/2; ty=(r.height-ih*s)/2; apply();}
img.onload=fit; window.addEventListener('resize',fit);
function render(){pinsEl.innerHTML=''; const undoneOnly=document.getElementById('showUndone').checked; pins.forEach(p=>{if(undoneOnly&&p.done)return; const b=document.createElement('button'); b.className='pin '+(p.done?'done':''); b.style.left=(p.x*100)+'%'; b.style.top=(p.y*100)+'%'; b.innerHTML='<span>'+(p.done?'✓':'📦')+'</span>'; b.onclick=e=>{e.stopPropagation();openDrawer(p.id)}; pinsEl.appendChild(b);}); document.getElementById('total').textContent=pins.length; document.getElementById('done').textContent=pins.filter(p=>p.done).length;}
function openDrawer(id){selected=id; const p=pins.find(v=>v.id===id); drawer.classList.add('open'); drawer.innerHTML=`<img src="9F25521C-1D83-4829-BCE9-D1CD37F1B170.png" onerror="this.style.display='none'"><div class="drawerBody"><h2>${p.name}</h2><span class="tag">${p.done?'回収済み':'未回収'}</span><div class="row"><small>座標</small>${p.coord||'未入力'}</div><div class="row"><small>場所</small>${p.place||'未入力'}</div><div class="row"><small>説明</small>${p.desc||'未入力'}</div><div class="actions"><button onclick="toggleDone('${p.id}')">${p.done?'未回収に戻す':'回収済みにする'}</button><button onclick="copyCoord('${p.id}')">座標コピー</button><button class="danger" onclick="deletePin('${p.id}')">削除</button><button onclick="drawer.classList.remove('open')">閉じる</button></div></div>`;}
window.toggleDone=id=>{const p=pins.find(v=>v.id===id);p.done=!p.done;save();render();openDrawer(id)};
window.deletePin=id=>{pins=pins.filter(v=>v.id!==id);save();render();drawer.classList.remove('open')};
window.copyCoord=id=>{const p=pins.find(v=>v.id===id);navigator.clipboard?.writeText(p.coord||'')};
function stageToMap(cx,cy){const r=stage.getBoundingClientRect(); return {x:(cx-r.left-tx)/scale/(img.naturalWidth||1100), y:(cy-r.top-ty)/scale/(img.naturalHeight||1000)};}
let pointers=new Map(), lastDist=0, lastScale=1;
stage.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); stage.setPointerCapture(e.pointerId); active={x:e.clientX,y:e.clientY,tx,ty,t:Date.now()};});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); const pts=[...pointers.values()]; if(pts.length===1&&active){tx=active.tx+e.clientX-active.x; ty=active.ty+e.clientY-active.y; apply(); const m=stageToMap(e.clientX,e.clientY); coords.textContent=`X: ${Math.round(m.x*1000)} / Y: ${Math.round(m.y*1000)}`;} if(pts.length>=2){const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y); if(!lastDist){lastDist=d;lastScale=scale;} zoomAt((pts[0].x+pts[1].x)/2,(pts[0].y+pts[1].y)/2, lastScale*d/lastDist, false);}});
stage.addEventListener('pointerup',e=>{const was=active; pointers.delete(e.pointerId); lastDist=0; if(was&&Date.now()-was.t>650&&Math.hypot(e.clientX-was.x,e.clientY-was.y)<8){addPos=stageToMap(e.clientX,e.clientY); document.getElementById('form').classList.add('open');} active=null;});
stage.addEventListener('wheel',e=>{e.preventDefault(); zoomAt(e.clientX,e.clientY,scale*(e.deltaY<0?1.12:.88));},{passive:false});
function zoomAt(cx,cy,newScale,clamp=true){newScale=Math.max(.35,Math.min(4,newScale)); const r=stage.getBoundingClientRect(); const mx=(cx-r.left-tx)/scale, my=(cy-r.top-ty)/scale; scale=newScale; tx=cx-r.left-mx*scale; ty=cy-r.top-my*scale; apply();}
zin.onclick=()=>zoomAt(innerWidth/2,innerHeight/2,scale*1.2); zout.onclick=()=>zoomAt(innerWidth/2,innerHeight/2,scale*.8); fitBtn.onclick=fit;
addBtn.onclick=()=>{addPos=stageToMap(stage.clientWidth/2,stage.clientHeight/2); form.classList.add('open')}; cancelBtn.onclick=()=>form.classList.remove('open');
form.onsubmit=e=>{e.preventDefault(); pins.push({id:'p'+Date.now(),x:Math.max(0,Math.min(1,addPos.x)),y:Math.max(0,Math.min(1,addPos.y)),name:name.value,place:place.value,coord:coord.value,desc:desc.value,done:false}); form.reset(); form.classList.remove('open'); save(); render();};
showUndone.onchange=render; showAll.onchange=()=>{showUndone.checked=false;render()};
exportBtn.onclick=()=>{const data='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(pins,null,2)); const a=document.createElement('a');a.href=data;a.download='devibox-map-data.json';a.click();};
render();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
</body>
</html>
