<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>デビエーション収容箱マップ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#041011;color:#f4ffff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.app{height:100%;display:flex;flex-direction:column;background:linear-gradient(rgba(2,10,11,.36),rgba(2,10,11,.65)),url("site-bg-case.png?v=100");background-size:cover;background-position:center}
header{height:164px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;align-items:center;padding:10px 12px;background:rgba(3,16,18,.64);border-bottom:1px solid rgba(53,234,217,.35);z-index:20;backdrop-filter:blur(4px)}
.title{grid-column:1/5}.title h1{font-size:20px;line-height:1.08;margin:0}.sub{margin-top:5px;color:#a9bdc3;font-size:12px;letter-spacing:.08em}
.pill{border:1px solid rgba(53,234,217,.55);border-radius:15px;padding:7px 4px;text-align:center;background:rgba(35,120,115,.25)}
.pill small{display:block;color:#a9bdc3;font-weight:900}.pill b{font-size:29px;line-height:1}
button{border:1px solid rgba(53,234,217,.45);border-radius:13px;background:rgba(5,30,32,.86);color:#fff;font-weight:900}
.topbtn{padding:9px 4px;font-size:13px;width:100%;white-space:nowrap}
.headerVol{grid-column:4/5;width:100%;border:1px solid rgba(53,234,217,.35);border-radius:13px;background:rgba(3,18,20,.52);padding:4px 8px;font-size:11px;font-weight:900;color:#eaffff}
.headerVol label{display:flex;justify-content:space-between;align-items:center;line-height:1.1}.headerVol label:before{content:"🔊";margin-right:3px}
.headerVol input{width:100%;height:12px;accent-color:#35ead9}
.stage{position:relative;flex:1;overflow:hidden;touch-action:none;background:rgba(2,11,12,.32)}
.layer{position:absolute;left:0;top:0;transform-origin:0 0}.map{width:1060px;max-width:none;display:block;user-select:none;pointer-events:none}#pins{position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-50%);padding:0;border:0;background:transparent;filter:drop-shadow(0 0 8px #ffd34a) drop-shadow(0 0 16px rgba(255,211,74,.72));touch-action:none}
.pin img{width:58px;height:58px;object-fit:cover;border:3px solid #ffd34a;border-radius:10px;background:#001b1d;box-shadow:0 0 0 2px rgba(255,211,74,.24),0 0 18px rgba(255,211,74,.95)}
.pin.done{filter:drop-shadow(0 0 8px #43ff9b) drop-shadow(0 0 18px rgba(67,255,155,.72))}
.pin.done img{border-color:#43ff9b;box-shadow:0 0 0 2px rgba(67,255,155,.24),0 0 18px rgba(67,255,155,.95)}
.pin:after{content:"";position:absolute;right:-5px;top:-7px;border-radius:50%;background:#ffd34a;width:24px;height:24px;box-shadow:0 0 10px rgba(255,211,74,.95)}
.pin.done:after{content:"✓";display:grid;place-items:center;background:#43ff9b;color:#04351c;font-weight:900}
.pin span{position:absolute;left:50%;top:52px;transform:translateX(-50%);white-space:nowrap;background:rgba(0,20,22,.94);border:1px solid rgba(255,211,74,.82);border-radius:8px;padding:2px 7px;font-size:11px;font-weight:900}
.mapSwitch{position:absolute;left:12px;top:58px;z-index:25;display:flex;align-items:center;gap:8px;background:rgba(3,18,20,.72);border:1px solid rgba(53,234,217,.38);border-radius:999px;padding:7px 12px;backdrop-filter:blur(5px);font-weight:900}
.mapSwitch label{font-size:11px;line-height:1.05;color:#a9bdc3;text-align:center;white-space:nowrap}
.mapSwitch select{border:0;background:transparent;color:#fff;font-weight:900;font-size:14px;outline:none}.mapSwitch option{background:#041011;color:#fff}
.floating{position:absolute;left:12px;top:104px;z-index:25}.floating button{padding:9px 13px;border-radius:999px;font-size:14px}
.panel{display:none;position:absolute;left:12px;top:150px;width:170px;z-index:30;background:rgba(3,18,20,.62);border:1px solid rgba(53,234,217,.35);border-radius:12px;padding:8px;backdrop-filter:blur(5px)}
.panel.open{display:block}.panel h2{font-size:12px;margin:0 0 4px}.big{font-size:20px;font-weight:900}
.chk{display:flex;gap:5px;align-items:center;margin:6px 0;font-weight:800;font-size:12px}.chk input{width:18px;height:18px;accent-color:#35ead9}
.zoom{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;gap:10px}.zoom button{width:58px;height:58px;font-size:36px}
.ver{position:absolute;right:16px;bottom:20px;color:rgba(255,255,255,.55);z-index:15}
.drawer{position:absolute;left:14px;right:14px;bottom:14px;max-height:72%;overflow:auto;z-index:40;background:rgba(3,15,17,.94);border-radius:20px;padding:18px;transform:translateY(115%);transition:.22s;backdrop-filter:blur(10px)}
.drawer:not(.open){visibility:hidden}.drawer.open{transform:translateY(0);visibility:visible}
.head{display:flex;gap:10px}.head h2{flex:1;margin:0;font-size:22px;line-height:1.25}.close{width:44px;height:44px;font-size:28px}.shot{width:100%;border-radius:14px;border:1px solid rgba(255,255,255,.16);margin:8px 0 14px}
.row{border-top:1px solid rgba(255,255,255,.12);padding:12px 0}.lab{color:#a9bdc3;font-size:13px}.val{font-size:18px;line-height:1.45}
.doneBox{margin-top:6px;border:1px solid rgba(53,234,217,.35);border-radius:10px;padding:6px 10px;display:inline-flex;gap:8px;align-items:center;font-size:17px;font-weight:900;background:rgba(32,210,190,.1)}.doneBox input{width:22px;height:22px;accent-color:#35ead9}
.copyCoord{margin-left:8px;padding:5px 9px;border-radius:999px;font-size:12px;vertical-align:middle}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#092c2f;border:1px solid rgba(53,234,217,.45);border-radius:999px;padding:10px 18px;z-index:60;transition:.2s;font-weight:800}.toast.show{transform:translateX(-50%) translateY(0)}
.coord{display:none}

















.scenarioNote{
  position:absolute;
  left:20px;
  right:210px;
  top:205px;
  z-index:45;
  color:rgba(255,255,255,.94);
  font-size:14px;
  font-weight:800;
  line-height:1.55;
  text-align:left;
  background:rgba(3,18,20,.70);
  border:1.5px solid rgba(53,234,217,.78);
  border-radius:10px;
  padding:10px 14px;
  box-sizing:border-box;
  backdrop-filter:blur(6px);
  pointer-events:none;
}
.dailyNote{
  position:absolute;
  left:20px;
  bottom:28px;
  width:min(520px,calc(100vw - 230px));
  z-index:45;
  color:rgba(255,255,255,.92);
  font-size:14px;
  line-height:1.45;
  text-align:left;
  background:rgba(3,18,20,.68);
  border:1.5px solid rgba(53,234,217,.78);
  border-radius:12px;
  padding:10px 14px;
  box-sizing:border-box;
  backdrop-filter:blur(6px);
  pointer-events:none;
}

</style>
<!-- Ver1.0 stable: fixed pins, no cache-clearing JS, no old coordinate restore -->
<!-- Ver1.0 stable from Ver1.0: Manibus No.006 kept, Hakugin No.005/006 adjusted only -->
<!-- Ver1.0 stable: Hakugin No.005 and No.006 moved to target positions from reference image -->
<!-- Ver1.0: every page load starts from Manibus; Hakugin 5/6 positions kept -->
<!-- Ver1.0: Manibus initial right gap fix, vertical pan loosened, background image updated -->
<!-- Ver1.0 public release: descriptions updated, daily recovery note added, HTML audio BGM -->
<!-- Final Ver1.0: note moved lower-left, shared scenario text added -->
<!-- Final Ver1.0 v96: scenario note under header, recovery note beside Version -->
<!-- Final Ver1.0 v97: exact note layout matched to reference image -->
<!-- Ver1.0 Final v98: approved note layout exactly applied -->
<!-- Ver1.0 v99: mockup-matched fixed note boxes -->

</head>
<body>
<div class="app">
<header>
  <div class="title"><h1>デビエーション収容箱マップ</h1><div class="sub"><span id="mapSub">MANIBUS BASE MAP</span> / Ver1.0</div></div>
  <div class="pill"><small>回収率</small><b id="countTop">0/6</b></div>
  <button class="topbtn" id="fit">全体表示</button>
  <button class="topbtn" id="reset">リセット</button>
  <button class="topbtn" id="bgmBtn">BGM OFF</button>
  <div class="headerVol"><label>音量 <span id="volLabel">35%</span></label><input id="volSlider" type="range" min="0" max="100" value="35"></div>
</header>
<main id="stage" class="stage">
  <div id="layer" class="layer"><img id="map" class="map" src="manibus-map-clean.png?v=100" alt=""><div id="pins"></div></div>
  <div class="mapSwitch"><label>マップ<br>切り替え</label><select id="mapSelect"><option value="manibus">マニブス 0/6</option><option value="hakugin">白銀 0/6</option></select></div>
  <div class="floating"><button id="panelBtn">表示設定</button></div>
  <section id="panel" class="panel">
    <h2>発見状況</h2><div class="big" id="countBig">0/6</div>
    <label class="chk"><input id="showAll" type="checkbox" checked>すべて</label>
    <label class="chk"><input id="showUndone" type="checkbox">未回収のみ</label>
    <label class="chk"><input id="editPins" type="checkbox">ピン位置調整</label>
  </section>
  <div class="zoom"><button id="zin">＋</button><button id="zout">−</button></div>
  <div class="scenarioNote">シナリオ「永い夢」のマニブス・白銀マップの<br>デビエーション収容箱の場所も共通です。</div><div id="coord" class="coord"></div><div class="dailyNote">各デビエーション収容箱から1日1回まで回収可能。<br>毎日AM9:00に再度回収できます。</div><div class="ver">Version 1.0</div><aside id="drawer" class="drawer"></aside><div id="toast" class="toast">保存しました</div>
<audio id="dayAudio" src="day_bgm.mp3?v=100" loop preload="auto" playsinline></audio>
<audio id="nightAudio" src="night_bgm.mp3?v=100" loop preload="auto" playsinline></audio>
</main>
</div>
<script>
const MAPS={
  manibus:{label:'マニブス',sub:'MANIBUS BASE MAP',map:'manibus-map-clean.png?v=100',key:'deviationMapPins_v91_manibus',pins:[
    {id:'p1',no:'001',x:.70,y:.82,title:'マニブス デビエーション収容箱 No.001',region:'ブロークンデルタ',place:'マイヤー市場付近',coord:'5754,-6566',desc:'マイヤー市場の建物の部屋',image:'manibus-no001.jpg',done:false},
    {id:'p2',no:'002',x:.76,y:.72,title:'マニブス デビエーション収容箱 No.002',region:'デイトン湿地',place:'デッドウィル付近',coord:'5988,-5512',desc:'デッドウィルのワールドストーン裏の倉庫',image:'manibus-no002.jpg',done:false},
    {id:'p3',no:'003',x:.66,y:.58,title:'マニブス デビエーション収容箱 No.003',region:'アイアン川',place:'グレイウォーターキャンプ',coord:'5356,-3252',desc:'グレイウォーターキャンプのワールドストーン横の建物の階段を上がった屋上',image:'manibus-no003.png',done:false},
    {id:'p4',no:'004',x:.48,y:.71,title:'マニブス デビエーション収容箱 No.004',region:'クルタ山',place:'トール・グラス付近',coord:'3001,-4948',desc:'トール・グラスのワールドストーンから中央の湖沿いを右周りに進んだ右側にある小屋',image:'manibus-no004.jpg',done:false},
    {id:'p5',no:'005',x:.56,y:.47,title:'マニブス デビエーション収容箱 No.005',region:'ローンウルフ荒野',place:'ブラックフェルタウン付近',coord:'4109,-1447',desc:'ブラックフェルタウンのワールドストーンを真っ直ぐ進んだ先にある大きな建物の左側',image:'manibus-no005.jpg',done:false},
    {id:'p6',no:'006',x:.735,y:.435,title:'マニブス デビエーション収容箱 No.006',region:'ローンウルフ荒野',place:'AR研究所',coord:'6931,-1805',desc:'AR研究所4階の謎の箱があるフロアの奥の部屋',image:'manibus-no006.jpg',done:false}
  ]},
  hakugin:{label:'白銀',sub:'HAKUGIN MAP',map:'hakugin-map.png?v=100',key:'deviationMapPins_v91_hakugin',pins:[
    {id:'h1',no:'001',x:.830,y:.360,title:'白銀 デビエーション収容箱 No.001',region:'メノウ凍原',place:'座礁の浜',coord:'6237,5544',desc:'座礁の浜の船の右脇の波打ち際',image:'hakugin-no001.jpg',done:false},
    {id:'h2',no:'002',x:.63,y:.48,title:'白銀 デビエーション収容箱 No.002',region:'ヴィーナ峡湾',place:'アイスケーブ',coord:'-391,5508',desc:'アイスケーブのワールドストーンの左側',image:'hakugin-no002.jpg',done:false},
    {id:'h3',no:'003',x:.49,y:.54,title:'白銀 デビエーション収容箱 No.003',region:'ヴィーナ峡湾',place:'シダーロッジ',coord:'-1493,4551',desc:'シダーロッジの小屋',image:'hakugin-no003.jpg',done:false},
    {id:'h4',no:'004',x:.28,y:.73,title:'白銀 デビエーション収容箱 No.004',region:'ヴィーナ峡湾',place:'プロメテウス研究所',coord:'-5137,3170',desc:'プロメテウス研究所の建物内2階中央の部屋',image:'hakugin-no004.jpg',done:false},
    {id:'h5',no:'005',x:.315,y:.430,title:'白銀 デビエーション収容箱 No.005',region:'余燼の浜辺',place:'精製所廃墟',coord:'-4139,5333',desc:'精製所廃墟の入り口から入って右側の廃材置き場',image:'hakugin-no005.jpg',done:false},
    {id:'h6',no:'006',x:.185,y:.365,title:'白銀 デビエーション収容箱 No.006',region:'余燼の浜辺',place:'ソイルエリア',coord:'-5331,5998',desc:'ソイルエリアの倉庫',image:'hakugin-no006.jpg',done:false}
  ]}
};
let currentMapId='manibus';
let currentMap=MAPS[currentMapId]||MAPS.manibus;
let pins=[];
const stage=document.getElementById('stage'),layer=document.getElementById('layer'),map=document.getElementById('map'),pinsEl=document.getElementById('pins'),drawer=document.getElementById('drawer'),toast=document.getElementById('toast');
let scale=1,tx=0,ty=0,pointers=new Map(),lastX=0,lastY=0,startScale=1,startDist=0;
function clonePins(arr){return arr.map(p=>({...p}))}
function loadMapPins(){currentMap=MAPS[currentMapId]||MAPS.manibus;const s=JSON.parse(localStorage.getItem(currentMap.key)||'null');pins=clonePins(currentMap.pins);if(s&&Array.isArray(s)){pins.forEach(p=>{const old=s.find(v=>v.id===p.id);if(old)p.done=!!old.done})}}
function save(){localStorage.setItem(currentMap.key,JSON.stringify(pins))}
function msg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}
function mapW(){return map.offsetWidth||1060}
function mapH(){return map.offsetHeight||Math.round((map.naturalHeight||1000)*(mapW()/(map.naturalWidth||1100)))}
function clampPan(){
  const r=stage.getBoundingClientRect();
  const w=mapW()*scale,h=mapH()*scale;
  const marginX=220;
  const marginY=360;
  if(w<=r.width)tx=(r.width-w)/2;
  else tx=Math.min(marginX,Math.max(r.width-w-marginX,tx));
  if(h<=r.height)ty=(r.height-h)/2;
  else ty=Math.min(marginY,Math.max(r.height-h-marginY,ty));
}
function apply(){clampPan();layer.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function fitMap(){const r=stage.getBoundingClientRect(),w=map.naturalWidth||1100,h=map.naturalHeight||1000;if(currentMapId==='hakugin'){scale=r.width/w*1.82;tx=(r.width-w*scale)/2+78;ty=Math.max(8,(r.height-h*scale)/2-10)}else{scale=Math.min(r.width/w*1.26,r.height/h*1.26);tx=(r.width-w*scale)/2+54;ty=Math.max(14,(r.height-h*scale)/2-6)}apply()}
function updateCounts(){const d=pins.filter(p=>p.done).length,t=pins.length;countTop.textContent=countBig.textContent=`${d}/${t}`;Object.keys(MAPS).forEach((id,idx)=>{const m=MAPS[id];const s=JSON.parse(localStorage.getItem(m.key)||'null');const arr=(s&&s.length===m.pins.length)?s:m.pins;const done=arr.filter(p=>p.done).length;mapSelect.options[idx].text=`${m.label} ${done}/${m.pins.length}`})}
function render(){pinsEl.innerHTML='';const undone=showUndone.checked,edit=editPins.checked;pins.forEach(p=>{if(undone&&p.done)return;const b=document.createElement('button');b.className='pin'+(p.done?' done':'')+(edit?' edit':'');b.style.left=(p.x*100)+'%';b.style.top=(p.y*100)+'%';b.innerHTML=`<img src="deviation-box-icon.png?v=100" onerror="this.style.display='none'"><span>No.${p.no}</span>`;b.addEventListener('pointerdown',ev=>pinDown(ev,p,b));b.addEventListener('click',ev=>{ev.stopPropagation();if(!edit)openDrawer(p.id)});pinsEl.appendChild(b)});updateCounts()}
function switchMap(id){currentMapId=id;/* start map is always manibus; do not save current map */loadMapPins();map.src=currentMap.map;mapSub.textContent=currentMap.sub;mapSelect.value=id;drawer.classList.remove('open');render();setTimeout(fitMap,80);msg(currentMap.label+'に切り替えました')}
function stageToMap(cx,cy){const r=stage.getBoundingClientRect();return {x:(cx-r.left-tx)/scale,y:(cy-r.top-ty)/scale}}
function pinDown(e,p,el){if(!editPins.checked)return;e.preventDefault();e.stopPropagation();let moved=false;el.setPointerCapture(e.pointerId);const move=ev=>{moved=true;const m=stageToMap(ev.clientX,ev.clientY);p.x=Math.max(0,Math.min(1,m.x/mapW()));p.y=Math.max(0,Math.min(1,m.y/mapH()));el.style.left=(p.x*100)+'%';el.style.top=(p.y*100)+'%'};const up=()=>{el.removeEventListener('pointermove',move);if(moved){save();render();msg('位置を保存しました')}};el.addEventListener('pointermove',move);el.addEventListener('pointerup',up,{once:true})}
function openDrawer(id){const p=pins.find(v=>v.id===id);drawer.innerHTML=`<div class="head"><h2>${p.title}</h2><button class="close" onclick="closeDrawer()">×</button></div><div class="row"><div class="lab">状態</div><label class="doneBox"><input type="checkbox" ${p.done?'checked':''} onchange="toggleDone('${p.id}')">回収済み</label></div><img class="shot" src="${p.image}?v=100"><div class="row"><div class="lab">地域</div><div class="val">${p.region}</div></div><div class="row"><div class="lab">場所</div><div class="val">${p.place}</div></div><div class="row"><div class="lab">座標</div><div class="val">${p.coord}<button class="copyCoord" onclick="copyCoord('${p.coord}')">コピー</button></div></div><div class="row"><div class="lab">説明</div><div class="val">${p.desc}</div></div>`;drawer.classList.add('open')}
window.closeDrawer=()=>drawer.classList.remove('open');
window.toggleDone=id=>{const p=pins.find(v=>v.id===id);p.done=!p.done;save();render();openDrawer(id)}
window.copyCoord=text=>{try{navigator.clipboard.writeText(text);msg('座標をコピーしました')}catch(e){msg(text)}}
panelBtn.onclick=()=>panel.classList.toggle('open');
mapSelect.onchange=()=>switchMap(mapSelect.value);
showAll.onchange=()=>{if(showAll.checked)showUndone.checked=false;render()};
showUndone.onchange=()=>{if(showUndone.checked)showAll.checked=false;render()};
editPins.onchange=render;
fit.onclick=()=>fitMap();
reset.onclick=()=>{pins.forEach(p=>p.done=false);save();render();msg('リセットしました')};
zin.onclick=()=>zoomAt(innerWidth/2,innerHeight/2,scale*1.2);
zout.onclick=()=>zoomAt(innerWidth/2,innerHeight/2,scale*.82);
function zoomAt(cx,cy,ns){ns=Math.max(.35,Math.min(4,ns));const r=stage.getBoundingClientRect();const mx=(cx-r.left-tx)/scale,my=(cy-r.top-ty)/scale;scale=ns;tx=cx-r.left-mx*scale;ty=cy-r.top-my*scale;apply()}
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.pin,.drawer,.panel,.floating,.zoom,.mapSwitch'))return;stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,e);if(pointers.size===1){lastX=e.clientX;lastY=e.clientY}if(pointers.size===2){const a=[...pointers.values()];startDist=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);startScale=scale}});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,e);if(pointers.size===1){tx+=e.clientX-lastX;ty+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;apply()}else if(pointers.size===2){const a=[...pointers.values()];const d=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);zoomAt((a[0].clientX+a[1].clientX)/2,(a[0].clientY+a[1].clientY)/2,startScale*(d/startDist))}});
stage.addEventListener('pointerup',e=>pointers.delete(e.pointerId));stage.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));

const dayAudio=document.getElementById('dayAudio'),nightAudio=document.getElementById('nightAudio');
let bgmMode=localStorage.getItem('deviationMapBgm_v91')||localStorage.getItem('deviationMapBgm_v92')||'off';
let bgmVolume=Number(localStorage.getItem('deviationMapBgmVolume_v91')||localStorage.getItem('deviationMapBgmVolume_v92')||'35');
function setBgmButton(){bgmBtn.textContent=bgmMode==='day'?'☀️ DAY':bgmMode==='night'?'🌙 NIGHT':'BGM OFF'}
function setVolumeUi(){volSlider.value=bgmVolume;volLabel.textContent=bgmVolume+'%'}
function applyAudioVolume(){[dayAudio,nightAudio].forEach(a=>{if(a){a.volume=Math.max(0,Math.min(1,bgmVolume/100))}})}
function stopBgm(){[dayAudio,nightAudio].forEach(a=>{if(a){try{a.pause();a.currentTime=0}catch(e){}}})}
async function playBgm(mode){
  bgmMode=mode;
  localStorage.setItem('deviationMapBgm_v93',mode);
  applyAudioVolume();
  stopBgm();
  if(mode==='day'&&dayAudio){try{await dayAudio.play()}catch(e){msg('BGMボタンをもう一度押してください')}}
  if(mode==='night'&&nightAudio){try{await nightAudio.play()}catch(e){msg('BGMボタンをもう一度押してください')}}
  setBgmButton();
}
bgmBtn.onclick=()=>{playBgm(bgmMode==='off'?'day':bgmMode==='day'?'night':'off')};
volSlider.oninput=()=>{
  bgmVolume=Number(volSlider.value);
  localStorage.setItem('deviationMapBgmVolume_v93',String(bgmVolume));
  volLabel.textContent=bgmVolume+'%';
  applyAudioVolume();
};
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&bgmMode!=='off'){
    const a=bgmMode==='day'?dayAudio:nightAudio;
    if(a&&a.paused){a.play().catch(()=>{})}
  }
});
function init(){loadMapPins();map.src=currentMap.map;mapSub.textContent=currentMap.sub;mapSelect.value=currentMapId;setBgmButton();setVolumeUi();applyAudioVolume();render();map.onload=fitMap;setTimeout(fitMap,150)}
init();
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}
</script>
</body>
</html>
