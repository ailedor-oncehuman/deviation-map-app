<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>デビエーション収容箱マップ</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#041011;color:#f4ffff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at top,#08363a 0,#041011 42%,#020909 100%)}
header{height:96px;display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px 14px;background:rgba(3,16,18,.96);border-bottom:1px solid rgba(53,234,217,.35);z-index:20}
h1{font-size:21px;line-height:1.08;margin:0}.sub{margin-top:5px;color:#a9bdc3;font-size:13px;letter-spacing:.08em}
.pill{border:1px solid rgba(53,234,217,.55);border-radius:15px;padding:7px 14px;text-align:center;background:rgba(35,120,115,.25);min-width:94px}
.pill small{display:block;color:#a9bdc3;font-weight:900}.pill b{font-size:30px;line-height:1}
button{border:1px solid rgba(53,234,217,.45);border-radius:13px;background:rgba(5,30,32,.86);color:#fff;font-weight:900}
.topbtn{padding:13px 15px;font-size:16px}
.stage{position:relative;flex:1;overflow:hidden;touch-action:none;background:#020b0c}
.layer{position:absolute;left:0;top:0;transform-origin:0 0}
.map{width:1100px;max-width:none;display:block;user-select:none;pointer-events:none}
#pins{position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-50%);padding:0;border:0;background:transparent;filter:drop-shadow(0 0 10px #35ead9);touch-action:none}
.pin img{width:58px;height:58px;object-fit:cover;border:2px solid #35ead9;border-radius:10px;background:#001b1d}
.pin.done img{border-color:#72ffbd}
.pin:after{content:"";position:absolute;right:-5px;top:-7px;border-radius:50%;background:#35ead9;color:#042;width:24px;height:24px;display:grid;place-items:center;font-weight:900}
.pin.done:after{content:"✓"}
.pin span{position:absolute;left:50%;top:52px;transform:translateX(-50%);white-space:nowrap;background:rgba(0,20,22,.92);border:1px solid rgba(53,234,217,.45);border-radius:8px;padding:2px 7px;font-size:11px;font-weight:900}
.floating{position:absolute;left:12px;top:12px;z-index:25}.floating button{padding:9px 13px;border-radius:999px;font-size:14px}
.panel{display:none;position:absolute;left:12px;top:58px;width:176px;z-index:30;background:rgba(3,18,20,.58);border:1px solid rgba(53,234,217,.38);border-radius:13px;padding:9px;backdrop-filter:blur(6px)}
.panel.open{display:block}.panel h2{font-size:13px;margin:0 0 5px}.big{font-size:22px;font-weight:900;margin-bottom:4px}
.chk{display:flex;gap:6px;align-items:center;margin:7px 0;font-weight:850;font-size:13px}.chk input{width:19px;height:19px;accent-color:#35ead9}
.hint{font-size:10px;line-height:1.35;color:#d9f2f4;margin-top:6px}
.zoom{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;gap:10px}
.zoom button{width:58px;height:58px;font-size:36px}
.coord{position:absolute;left:14px;bottom:18px;border:1px solid rgba(53,234,217,.42);border-radius:14px;background:rgba(4,22,25,.85);padding:10px 16px;font-weight:900;color:#cffff9;z-index:15}
.ver{position:absolute;right:16px;bottom:20px;color:rgba(255,255,255,.55);z-index:15}
.drawer{position:absolute;left:14px;right:14px;bottom:14px;max-height:72%;overflow:auto;z-index:40;background:rgba(3,15,17,.94);border:1px solid rgba(53,234,217,.35);border-radius:20px;padding:18px;transform:translateY(115%);transition:.22s;backdrop-filter:blur(10px)}
.drawer.open{transform:translateY(0)}.head{display:flex;gap:10px}.head h2{flex:1;margin:0;font-size:22px;line-height:1.25}.close{width:44px;height:44px;font-size:28px}
.shot{width:100%;border-radius:14px;border:1px solid rgba(255,255,255,.16);margin:8px 0 14px}
.row{border-top:1px solid rgba(255,255,255,.12);padding:12px 0}.lab{color:#a9bdc3;font-size:13px}.val{font-size:18px;line-height:1.45}
.doneBox{margin-top:8px;border:1px solid rgba(53,234,217,.35);border-radius:12px;padding:10px 12px;display:inline-flex;gap:10px;align-items:center;font-size:18px;font-weight:900;background:rgba(32,210,190,.1)}
.doneBox input{width:26px;height:26px;accent-color:#35ead9}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#092c2f;border:1px solid rgba(53,234,217,.45);border-radius:999px;padding:10px 18px;z-index:60;transition:.2s;font-weight:800}.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:720px){
 header{height:112px;grid-template-columns:1fr auto auto;padding:10px}
 .title{grid-column:1/4}.pill{grid-column:1}.stage{height:calc(100vh - 112px)}.map{width:1060px}
 h1{font-size:20px}.topbtn{padding:12px 14px}.pill b{font-size:30px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="title"><h1>デビエーション収容箱マップ</h1><div class="sub">MANIBUS BASE MAP / Ver1.6 clamp</div></div>
  <div class="pill"><small>回収率</small><b id="countTop">0/5</b></div>
  <button class="topbtn" id="fit">全体表示</button>
  <button class="topbtn" id="reset">リセット</button>
</header>

<main id="stage" class="stage">
  <div id="layer" class="layer">
    <img id="map" class="map" src="./manibus-map-clean.png?v=16" alt="">
    <div id="pins"></div>
  </div>

  <div class="floating"><button id="panelBtn">表示設定</button></div>
  <section id="panel" class="panel">
    <h2>発見状況</h2>
    <div class="big" id="countBig">0/5</div>
    <label class="chk"><input id="showAll" type="checkbox" checked>すべて</label>
    <label class="chk"><input id="showUndone" type="checkbox">未回収のみ</label>
    <label class="chk"><input id="editPins" type="checkbox">ピン位置調整</label>
    <div class="hint">フィルター・データ管理は今後追加予定<br>ONでピンを動かせます</div>
  </section>

  <div class="zoom"><button id="zin">＋</button><button id="zout">−</button></div>
  <div id="coord" class="coord">X: 0 / Y: 0</div>
  <div class="ver">Version 1.6</div>
  <aside id="drawer" class="drawer"></aside>
  <div id="toast" class="toast">保存しました</div>
</main>
</div>

<script>
const DEFAULT=[
{id:'p1',no:'001',x:.70,y:.82,title:'デビエーション収容箱 No.001',region:'ブロークンデルタ',place:'マイヤー市場付近',coord:'5754,-6566',desc:'マイヤー市場拠点の小部屋の中',image:'No001.png',done:false},
{id:'p2',no:'002',x:.76,y:.72,title:'デビエーション収容箱 No.002',region:'デイトン湿地',place:'デッドウィル付近',coord:'5988,-5512',desc:'デッドウィルのワールドストーン裏の小屋の中',image:'No002.png',done:false},
{id:'p3',no:'003',x:.66,y:.58,title:'デビエーション収容箱 No.003',region:'アイアン川',place:'グレイウォーターキャンプ',coord:'5356,-3252',desc:'グレイウォーターキャンプのワールドストーン横の建物の階段を上がった場所',image:'No003.png',done:false},
{id:'p4',no:'004',x:.48,y:.71,title:'デビエーション収容箱 No.004',region:'クルタ山',place:'トール・グラス付近',coord:'3001,-4948',desc:'トール・グラスのワールドストーンから湖沿いに右へ進んだ先にある小屋の中',image:'No004.png',done:false},
{id:'p5',no:'005',x:.56,y:.47,title:'デビエーション収容箱 No.005',region:'ローンウルフ荒野',place:'ブラックフェルタウン付近',coord:'4109,-1447',desc:'ブラックフェルタウンのワールドストーンを真っ直ぐ進んだ先にある大きな建物の左側の建物の中',image:'No005.png',done:false}
];

const KEY='deviationMapPins_v16';
let saved=JSON.parse(localStorage.getItem(KEY)||'null');
let pins=(saved&&saved.length===5)?saved:DEFAULT.map(p=>({...p}));
const stage=document.getElementById('stage'),layer=document.getElementById('layer'),map=document.getElementById('map'),pinsEl=document.getElementById('pins'),drawer=document.getElementById('drawer'),coord=document.getElementById('coord'),toast=document.getElementById('toast');
let scale=1,tx=0,ty=0,selected=null,pointers=new Map(),lastX=0,lastY=0,startScale=1,startDist=0;

function save(){localStorage.setItem(KEY,JSON.stringify(pins))}
function msg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}
function clampPan(){
  const r=stage.getBoundingClientRect();
  const w=(map.naturalWidth||1100)*scale;
  const h=(map.naturalHeight||1000)*scale;
  const margin=90;
  if(w<=r.width){
    tx=(r.width-w)/2;
  }else{
    tx=Math.min(margin, Math.max(r.width-w-margin, tx));
  }
  if(h<=r.height){
    ty=(r.height-h)/2;
  }else{
    ty=Math.min(margin, Math.max(r.height-h-margin, ty));
  }
}
function apply(){clampPan();layer.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function fit(){const r=stage.getBoundingClientRect(),w=map.naturalWidth||1100,h=map.naturalHeight||1000;scale=Math.min(r.width/w,r.height/h)*.94;tx=(r.width-w*scale)/2;ty=(r.height-h*scale)/2;apply()}
map.onload=fit;if(map.complete)fit();window.addEventListener('resize',fit);

function counts(){let d=pins.filter(p=>p.done).length,t=pins.length;countTop.textContent=countBig.textContent=`${d}/${t}`}
function render(){
  const undone=showUndone.checked,edit=editPins.checked;
  pinsEl.innerHTML='';
  pins.forEach(p=>{
    if(undone&&p.done)return;
    let b=document.createElement('button');
    b.className='pin'+(p.done?' done':'')+(edit?' edit':'');
    b.style.left=p.x*100+'%'; b.style.top=p.y*100+'%';
    b.innerHTML=`<img src="deviation-box-icon.png?v=16"><span>No.${p.no}</span>`;
    b.addEventListener('pointerdown',e=>pinDown(e,p,b));
    b.onclick=e=>{e.stopPropagation(); if(!edit)openDrawer(p.id)};
    pinsEl.appendChild(b);
  });
  counts();
}
function pinDown(e,p,el){
  if(!editPins.checked)return;
  e.stopPropagation();el.setPointerCapture(e.pointerId);
  const move=ev=>{const m=stageToMap(ev.clientX,ev.clientY);p.x=m.x/(map.naturalWidth||1100);p.y=m.y/(map.naturalHeight||1000);render()};
  const up=()=>{el.removeEventListener('pointermove',move);save();msg('位置を保存しました')};
  el.addEventListener('pointermove',move);el.addEventListener('pointerup',up,{once:true});
}
function openDrawer(id){
  selected=id;let p=pins.find(v=>v.id===id);
  drawer.innerHTML=`<div class="head"><h2>${p.title}</h2><button class="close" onclick="closeDrawer()">×</button></div>
  <div class="row"><div class="lab">状態</div><label class="doneBox"><input type="checkbox" ${p.done?'checked':''} onchange="toggleDone('${p.id}')">回収済み</label></div>
  <img class="shot" src="${p.image}?v=16">
  <div class="row"><div class="lab">地域</div><div class="val">${p.region}</div></div>
  <div class="row"><div class="lab">場所</div><div class="val">${p.place}</div></div>
  <div class="row"><div class="lab">座標</div><div class="val">${p.coord}</div></div>
  <div class="row"><div class="lab">説明</div><div class="val">${p.desc}</div></div>`;
  drawer.classList.add('open');
}
window.closeDrawer=()=>drawer.classList.remove('open');
window.toggleDone=id=>{let p=pins.find(v=>v.id===id);p.done=!p.done;save();render();openDrawer(id)}

panelBtn.onclick=()=>panel.classList.toggle('open');
showAll.onchange=()=>{if(showAll.checked)showUndone.checked=false;render()};
showUndone.onchange=()=>{if(showUndone.checked)showAll.checked=false;render()};
editPins.onchange=render;
fit.onclick=fit;
reset.onclick=()=>{pins.forEach(p=>p.done=false);save();render();msg('リセットしました')};

function stageToMap(cx,cy){const r=stage.getBoundingClientRect();return {x:(cx-r.left-tx)/scale,y:(cy-r.top-ty)/scale}}
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.pin,.drawer,.panel,.floating,.zoom'))return;
  stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,e);
  if(pointers.size===1){lastX=e.clientX;lastY=e.clientY}
  if(pointers.size===2){const a=[...pointers.values()];startDist=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);startScale=scale}
});
stage.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,e);
  if(pointers.size===1){
    tx+=e.clientX-lastX;ty+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;apply();
    const m=stageToMap(e.clientX,e.clientY);coord.textContent=`X: ${Math.round(m.x)} / Y: ${Math.round(m.y)}`;
  }else if(pointers.size===2){
    const a=[...pointers.values()];
    const d=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);
    zoomAt((a[0].clientX+a[1].clientX)/2,(a[0].clientY+a[1].clientY)/2,startScale*(d/startDist),true);
  }
});
function end(e){pointers.delete(e.pointerId)}
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
function zoomAt(cx,cy,ns,clamp=true){
  if(clamp)ns=Math.max(.35,Math.min(4,ns));
  const r=stage.getBoundingClientRect();
  const mx=(cx-r.left-tx)/scale,my=(cy-r.top-ty)/scale;
  scale=ns;tx=cx-r.left-mx*scale;ty=cy-r.top-my*scale;apply();
}
zin.onclick=()=>zoomAt(innerWidth/2,innerHeight/2,scale*1.2);
zout.onclick=()=>zoomAt(innerWidth/2,innerHeight/2,scale*.82);
render();
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}
</script>
</body>
</html>
